name: live-orientation

# Live accuracy check against real OpenStreetMap/Overpass data. Kept out of the
# push/PR CI because Overpass availability is outside this repository's control.

on:
  push:
    branches: [arena/f9a95189-peche-tn]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  orientation-accuracy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Compare API orientation with OSM coastline geometry
        env:
          PECHE_TN_LIVE_OSM: "1"
        run: python -m pytest apps/api/tests/test_live_orientation_accuracy.py -s -q
