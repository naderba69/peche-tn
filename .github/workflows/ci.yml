name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=spotdata --cov-report=term-missing --cov-fail-under=85

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:render
      - run: test -s out/index.html && test -s out/offline.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  full-stack-container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag peche-tn:ci .
      - run: |
          docker run --detach --name peche-tn-ci --publish 10000:10000 --env PORT=10000 peche-tn:ci
          trap 'docker logs peche-tn-ci; docker rm --force peche-tn-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:10000/api/health > health.json; then break; fi
            sleep 1
          done
          python -c 'import json; value=json.load(open("health.json")); assert value["status"] == "ok" and value["version"] == "1.3.2"'
          curl --fail --silent http://127.0.0.1:10000/ | grep --quiet 'Peche TN'
