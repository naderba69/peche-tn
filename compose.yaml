services:
  api:
    build: .
    environment:
      APP_ENV: development
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000
      PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
